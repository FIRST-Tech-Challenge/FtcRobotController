import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

def localProps = new Properties()
def localFile = new File(settingsDir, "local.properties")
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://maven.pkg.github.com/FTC-21430/SWEEPDevelopment")
            credentials {
                username = localProps.getProperty("gpr.user")
                password = localProps.getProperty("gpr.key")
            }
        }
        maven {
            url = "https://repo.dairy.foundation/releases"
        }
    }
}

include ':FtcRobotController'
include ':TeamCode'
