apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven { url = 'https://maven.brott.dev/' }
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.dairy.foundation/releases/' } // Sinister/Sloth for Pedro's web tuner
}

dependencies {
    implementation project(':FtcRobotController')
    implementation('com.acmerobotics.dashboard:dashboard:0.6.0') {
        // The robot project owns the FTC SDK version (12.0.0).
        exclude group: 'org.firstinspires.ftc'
    }
    // Match Zenith v0.1.2's tested Pedro v3 API; keep autos/robot.json in sync.
    implementation('com.pedropathing:core:3.0.0-20260828.185437-17') {
        version { strictly '3.0.0-20260828.185437-17' }
    }
    implementation 'com.pedropathing.ivy:pedro:1.1.1'
    // Pedro's web tuner (http://192.168.43.1:10158). The library itself uses no Pedro core;
    // revhub is excluded so the strictly pinned core above stays the only Pedro core.
    implementation('com.pedropathing:tuning:1.0.1') {
        exclude group: 'com.pedropathing', module: 'revhub'
    }
    implementation 'com.github.Horizon-36596:zenith:v0.1.2'
    testImplementation 'junit:junit:4.13.2'
}

apply from: "$rootDir/simloop/simloop.gradle"
