<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Control Button Guide</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #2457c5;
      --green: #157347;
      --orange: #a84f00;
      --purple: #6f42c1;
      --border: #cfd7e3;
      --text: #17212b;
      --muted: #526170;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f7fb;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.35;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    header,
    section {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgb(23 33 43 / 6%);
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(1.65rem, 4vw, 2.3rem);
    }

    h2 {
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 1.5rem;
    }

    .subtitle,
    .note,
    footer {
      color: var(--muted);
    }

    .subtitle,
    .note {
      margin-bottom: 0;
    }

    .diagram-wrap {
      width: 100%;
      margin-top: 8px;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 900px;
      height: auto;
    }

    .callout {
      fill: #fff;
      stroke-width: 3;
    }

    .callout.drive {
      fill: #edf3ff;
      stroke: var(--blue);
    }

    .callout.shooter {
      fill: #fff3e7;
      stroke: var(--orange);
    }

    .callout.mechanism {
      fill: #eaf7f0;
      stroke: var(--green);
    }

    .callout.tuning {
      fill: #f3edff;
      stroke: var(--purple);
    }

    .line {
      fill: none;
      stroke: #ffd400;
      stroke-width: 5;
      filter: drop-shadow(0 0 1.5px #17212b);
    }

    .line.lumberjack {
      stroke: var(--purple);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line.shooter {
      stroke: var(--orange);
    }

    .line.tuning {
      stroke: var(--purple);
    }

    .line.intake {
      stroke: var(--green);
    }

    .line.drive {
      stroke: var(--blue);
    }

    .line.trigger {
      stroke: #c02678;
    }

    .line.trigger.hidden {
      stroke-dasharray: 12 8;
    }

    .dot.hidden-marker {
      stroke: #c02678;
      stroke-dasharray: 5 4;
      filter: none;
    }

    .callout.trigger {
      fill: #fce7f3;
      stroke: #c02678;
    }

    .dot {
      fill: #ff1744;
      stroke: #fff;
      stroke-width: 4;
      filter: drop-shadow(0 0 2px #17212b);
    }

    .dot.button-marker {
      fill: none;
      stroke: #ff1744;
      stroke-width: 3;
    }

    .label-title {
      fill: #101820;
      font-size: 25px;
      font-weight: 800;
    }

    .label-detail {
      fill: #17212b;
      font-size: 18px;
      font-weight: 600;
    }

    .legend {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      margin-top: 10px;
    }

    .legend span {
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .legend span {
      text-align: center;
      font-weight: 700;
    }

    .legend .drive {
      color: var(--blue);
      background: #edf3ff;
    }

    .legend .shooter {
      color: var(--orange);
      background: #fff3e7;
    }

    .legend .mechanism {
      color: var(--green);
      background: #eaf7f0;
    }

    .legend .tuning {
      color: var(--purple);
      background: #f3edff;
    }

    .startup {
      margin: 0;
      padding-left: 24px;
    }

    .startup li {
      padding: 2px 0;
    }

    footer {
      padding: 2px 4px;
      text-align: right;
      font-size: 0.85rem;
    }

    @media (max-width: 700px) {
      body {
        padding: 8px;
      }

      header,
      section {
        padding: 10px;
      }
    }

    @media print {
      @page {
        size: letter landscape;
        margin: 0.35in;
      }

      body {
        padding: 0;
        background: #fff;
      }

      header,
      section {
        break-inside: avoid;
        box-shadow: none;
      }

      .diagram-wrap {
        overflow: visible;
      }

      svg {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Remote Control Button Guide</h1>
    </header>

    <section aria-labelledby="diagram-heading">
      <h2 id="diagram-heading">Gamepad 1 Controls</h2>

      <div class="diagram-wrap">
        <svg viewBox="0 0 1400 820" role="img" aria-labelledby="diagram-title diagram-description">
          <title id="diagram-title">Remote Control gamepad button map</title>
          <desc id="diagram-description">Gamepad 1 controls for driving, half-speed mode, shooter, intake, trigger motor, and lumberjack.</desc>

          <image href="RemoteControlShooter-Controller.png" x="400" y="120" width="600" height="600"></image>

          <g>
            <polyline class="line drive" points="620,570 620,520 603,413"></polyline>
            <polyline class="line drive" points="780,570 780,520 797,413"></polyline>
            <polyline class="line drive" points="570,570 570,520 514,374"></polyline>
            <circle class="dot" cx="603" cy="413" r="8"></circle>
            <circle class="dot" cx="797" cy="413" r="8"></circle>
            <circle class="dot" cx="514" cy="366" r="8"></circle>
            <rect class="callout drive" x="510" y="570" width="380" height="123" rx="12"></rect>
            <text class="label-title" x="524" y="596">Driving</text>
            <text class="label-detail" x="524" y="621">Left stick: drive+strafe</text>
            <text class="label-detail" x="524" y="649">Right stick: turn</text>
            <text class="label-detail" x="524" y="677">D-pad Down: toggle normal/parking speed</text>
          </g>

          <g>
            <polyline class="line lumberjack" points="330,335 400,335 471,331"></polyline>
            <polyline class="line lumberjack" points="330,375 410,375 541,331"></polyline>
            <circle class="dot" cx="479" cy="331" r="8"></circle>
            <circle class="dot" cx="549" cy="331" r="8"></circle>
            <rect class="callout tuning" x="160" y="300" width="170" height="92" rx="12"></rect>
            <text class="label-title" x="174" y="326">Lumberjack</text>
            <text class="label-detail" x="174" y="351">D-pad Left: down</text>
            <text class="label-detail" x="174" y="379">D-pad right: up</text>
          </g>

          <g>
            <polyline class="line trigger hidden" points="300,180 300,262 492,262"></polyline>
            <polyline class="line trigger hidden" points="1100,180 1100,262 908,262"></polyline>
            <circle class="dot button-marker hidden-marker" cx="492" cy="262" r="12"></circle>
            <circle class="dot button-marker hidden-marker" cx="908" cy="262" r="12"></circle>
            <rect class="callout trigger" x="210" y="120" width="180" height="60" rx="12"></rect>
            <text class="label-title" x="224" y="146">Left Trigger</text>
            <text class="label-detail" x="224" y="173">Backwards</text>
            <rect class="callout trigger" x="1003" y="120" width="194" height="60" rx="12"></rect>
            <text class="label-title" x="1017" y="146">Right Trigger</text>
            <text class="label-detail" x="1017" y="173">Forwards</text>
          </g>

          <g>
            <polyline class="line shooter" points="600,95 510,230"></polyline>
            <polyline class="line shooter" points="790,95 514,296"></polyline>
            <polyline class="line shooter" points="600,95 890,230"></polyline>
            <polyline class="line shooter" points="790,95 885,288"></polyline>
            <circle class="dot" cx="510" cy="230" r="8"></circle>
            <circle class="dot" cx="890" cy="230" r="8"></circle>
            <circle class="dot" cx="885" cy="288" r="8"></circle>
            <circle class="dot" cx="514" cy="296" r="8"></circle>
            <rect class="callout shooter" x="500" y="0" width="360" height="95" rx="12"></rect>
            <text class="label-title" x="514" y="26">Shooter</text>
            <text class="label-detail" x="514" y="51">Left bumper: slower</text>
            <text class="label-detail" x="514" y="79">Right bumper: faster</text>
            <text class="label-detail" x="714" y="51">Triangle: reverse</text>
            <text class="label-detail" x="714" y="79">D-pad Up: stop</text>
          </g>

          <g>
            <polyline class="line intake" points="1030,365 1000,365 946,331"></polyline>
            <polyline class="line intake" points="1030,405 1010,405 860,331"></polyline>
            <polyline class="line intake" points="1030,445 1000,445 903,374"></polyline>
            <circle class="dot button-marker" cx="928" cy="331" r="18"></circle>
            <circle class="dot button-marker" cx="842" cy="331" r="18"></circle>
            <circle class="dot button-marker" cx="885" cy="374" r="18"></circle>
            <rect class="callout mechanism" x="1030" y="330" width="160" height="135" rx="12"></rect>
            <text class="label-title" x="1044" y="356">Intake</text>
            <text class="label-detail" x="1044" y="381">Circle: on</text>
            <text class="label-detail" x="1044" y="409">Square: reverse</text>
            <text class="label-detail" x="1044" y="437">X: stop</text>
          </g>
        </svg>
      </div>
    </section>

    <section aria-labelledby="startup-heading">
      <h2 id="startup-heading">Starting Settings</h2>
      <ul class="startup">
        <li><strong>Shooter power:</strong> 76%</li>
        <li><strong>Shooter P value:</strong> 60</li>
        <li><strong>Intake:</strong> Forward at +50% power</li>
        <li><strong>Trigger motor:</strong> Stopped; speed setting 50%</li>
        <li><strong>Drive speed mode:</strong> Normal (half-speed mode off)</li>
      </ul>
    </section>

    <section aria-labelledby="gamepad2-heading">
      <h2 id="gamepad2-heading">Gamepad 2 Controls</h2>
      <div class="diagram-wrap">
        <svg viewBox="0 0 1400 700" role="img" aria-labelledby="gamepad2-title gamepad2-description">
          <title id="gamepad2-title">Gamepad 2 speed and shooter tuning controls</title>
          <desc id="gamepad2-description">D-pad Up and Down adjust trigger speed, Circle and Square adjust signed intake power, and the bumpers adjust shooter P.</desc>
          <image href="RemoteControlShooter-Controller.png" x="400" y="100" width="600" height="600"></image>

          <g>
            <polyline class="line tuning" points="505,129 505,208"></polyline>
            <polyline class="line tuning" points="895,129 895,208"></polyline>
            <circle class="dot" cx="505" cy="208" r="8"></circle>
            <circle class="dot" cx="895" cy="208" r="8"></circle>
            <rect class="callout tuning" x="490" y="60" width="420" height="69" rx="12"></rect>
            <text class="label-title" x="504" y="86">Shooter P Tuning</text>
            <text class="label-detail" x="504" y="113">Left bumper: P -2</text>
            <text class="label-detail" x="724" y="113">Right bumper: P +2</text>
          </g>

          <g>
            <polyline class="line trigger" points="330,285 430,285 514,276"></polyline>
            <polyline class="line trigger" points="330,325 430,325 514,346"></polyline>
            <circle class="dot" cx="514" cy="276" r="8"></circle>
            <circle class="dot" cx="514" cy="346" r="8"></circle>
            <rect class="callout trigger" x="125" y="235" width="205" height="100" rx="12"></rect>
            <text class="label-title" x="139" y="261">Trigger Speed</text>
            <text class="label-detail" x="139" y="286">D-pad Up: +0.05</text>
            <text class="label-detail" x="139" y="314">D-pad Down: -0.05</text>
          </g>

          <g>
            <polyline class="line intake" points="1070,345 928,345 928,329"></polyline>
            <polyline class="line intake" points="1070,385 842,385 842,329"></polyline>
            <circle class="dot button-marker" cx="928" cy="311" r="18"></circle>
            <circle class="dot button-marker" cx="842" cy="311" r="18"></circle>
            <rect class="callout mechanism" x="1070" y="320" width="200" height="95" rx="12"></rect>
            <text class="label-title" x="1084" y="346">Intake Speed</text>
            <text class="label-detail" x="1084" y="371">Circle: +0.05</text>
            <text class="label-detail" x="1084" y="399">Square: -0.05</text>
          </g>
        </svg>
      </div>
    </section>

    <footer>v20261018-25</footer>
  </main>
</body>
</html>
