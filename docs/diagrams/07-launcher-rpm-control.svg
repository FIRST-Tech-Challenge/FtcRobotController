<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="760" height="464" role="img" aria-labelledby="title desc">
  <title id="title">How the launcher holds a speed, with real numbers</title>
  <desc id="desc">Every 50 milliseconds VelocityController.Calculate takes the target RPM and the measured RPM. Error is target minus measured: 1000 minus 900 is 100. Feed forward is kF times target: 0.000242 times 1000 is 0.242. Proportional is kP times error: 0.003 times 100 is 0.300. Integral is kI times the error added up over time, 0 for now. Power is the sum, 0.542, kept between 0 and 1. If the right trigger is held that power goes to the launcher motor, otherwise 0. The wheel spins, the encoder measures ticks per second, divided by 28 and times 60 gives the new measured RPM, which feeds back in.</desc>
  <style>
    /* Light theme. Dark theme is at the bottom of this block. */
    .panel { fill: #ffffff; stroke: #d3dae2; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1b2838; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-weight: 700; }
    .sub { fill: #566475; }
    .label { font-size: 11.5px; fill: #33475c; }
    .group { font-size: 10.5px; fill: #566475; letter-spacing: 0.04em; }
    .heading { font-size: 13px; font-weight: 700; }
    .accent-text { fill: #8a5a00; font-weight: 600; }
    .node text, .chip text { text-anchor: middle; }
    .ours { fill: #e6f0fa; stroke: #2c6aa3; stroke-width: 1.5; }
    .plain { fill: #f4f6f8; stroke: #8794a3; stroke-width: 1.25; }
    .sdk { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; }
    .lib { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .world { fill: #ffffff; stroke: #1b2838; stroke-width: 1.5; }
    .key { fill: #ffe7ad; stroke: #b37400; stroke-width: 2; }
    .frame { fill: none; stroke: #a3afbc; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .rule { stroke: #a3afbc; stroke-width: 1; }
    .edge { fill: none; stroke: #33475c; stroke-width: 1.5; stroke-linejoin: round; }
    .dashed { stroke-dasharray: 5 4; }
    .accent { stroke: #b37400; stroke-width: 2; }
    .head { fill: #33475c; }
    .head-accent { fill: #b37400; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #151b23; stroke: #2a3441; }
      text { fill: #e4e9ef; }
      .sub { fill: #9ba8b7; }
      .label { fill: #c3ccd6; }
      .group { fill: #9ba8b7; }
      .accent-text { fill: #f2b23a; }
      .ours { fill: #1b2f45; stroke: #74aee4; }
      .plain { fill: #1c232c; stroke: #6b7786; }
      .sdk { fill: #232a33; stroke: #8f9baa; }
      .lib { fill: #232a33; stroke: #8f9baa; }
      .world { fill: #151b23; stroke: #e4e9ef; }
      .key { fill: #4a3608; stroke: #f2b23a; }
      .frame { stroke: #4b5868; }
      .rule { stroke: #4b5868; }
      .edge { stroke: #c3ccd6; }
      .accent { stroke: #f2b23a; }
      .head { fill: #c3ccd6; }
      .head-accent { fill: #f2b23a; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="759" height="463" rx="10"/>
  <text class="heading mono" x="24" y="40">How the launcher holds a speed</text>
  <text class="label" x="24" y="58">One update of VelocityController. Example: target 1000 RPM, wheel measured at 900 RPM.</text>

  <!-- What the driver sets -->
  <g class="node">
    <rect class="plain" x="24" y="120" width="150" height="60" rx="8"/>
    <text class="title" font-size="13" x="99" y="139.6">target RPM</text>
    <text class="sub" font-size="11.5" x="99" y="155.0">starts at 1000</text>
    <text class="sub" font-size="11.5" x="99" y="170.0">bumpers move it 50</text>
  </g>

  <!-- The math, once per update -->
  <rect class="key" x="214" y="92" width="372" height="176" rx="8"/>
  <text class="heading mono" x="228" y="114">VelocityController.Calculate()</text>
  <text class="label" x="572" y="114" text-anchor="end">every 50 ms</text>
  <text class="mono" font-size="10.5" x="228" y="140">error = target − measured = 1000 − 900 = 100</text>
  <text class="mono" font-size="10.5" x="228" y="162">feed forward = kF × target = 0.000242 × 1000 = 0.242</text>
  <text class="mono" font-size="10.5" x="228" y="184">proportional = kP × error = 0.003 × 100 = 0.300</text>
  <text class="mono" font-size="10.5" x="228" y="206">integral = kI × error added up over time = 0</text>
  <text class="title mono" font-size="10.5" x="228" y="228">power = 0.242 + 0.300 + 0 = 0.542, kept in 0..1</text>
  <path class="edge" d="M174 150 L214 150" marker-end="url(#arrow)"/>
  <text class="label" x="194" y="142" text-anchor="middle">1000</text>

  <!-- Only while the trigger is held -->
  <g class="node">
    <rect class="plain" x="618" y="120" width="118" height="60" rx="8"/>
    <text class="title" font-size="13" x="677" y="139.6">right trigger</text>
    <text class="sub" font-size="11.5" x="677" y="155.0">held: that power</text>
    <text class="sub" font-size="11.5" x="677" y="170.0">let go: power 0</text>
  </g>
  <path class="edge" d="M586 150 L618 150" marker-end="url(#arrow)"/>
  <text class="label" font-size="10.5" x="602" y="142" text-anchor="middle">0.542</text>
  <g class="node">
    <rect class="world" x="618" y="250" width="118" height="44" rx="18"/>
    <text class="title" font-size="12" x="677" y="276.2">launcher motor</text>
  </g>
  <path class="edge" d="M677 180 L677 250" marker-end="url(#arrow)"/>
  <text class="label mono" x="669" y="221" text-anchor="end">setPower()</text>

  <!-- Feedback: the new speed is measured and goes back in -->
  <g class="node">
    <rect class="plain" x="214" y="330" width="360" height="74" rx="8"/>
    <text class="title" font-size="13" x="394" y="349.1">measured RPM</text>
    <text class="sub" font-size="11.5" x="394" y="364.5">encoder ticks per second ÷ 28 × 60</text>
    <text class="sub" font-size="11.5" x="394" y="379.5">= 900 RPM this time</text>
    <text class="sub" font-size="11.5" x="394" y="394.5">at speed when within 50 of the target: not yet</text>
  </g>
  <path class="edge accent" d="M677 294 L677 367 L574 367" marker-end="url(#arrow-accent)"/>
  <text class="label accent-text" x="669" y="318" text-anchor="end">the wheel spins</text>
  <path class="edge accent" d="M214 367 L194 367 L194 200 L214 200" marker-end="url(#arrow-accent)"/>
  <text class="label accent-text" x="186" y="292" text-anchor="end">measured</text>
  <text class="label accent-text" x="186" y="307" text-anchor="end">900 RPM</text>

  <!-- Where the numbers live -->
  <text class="group mono" x="24" y="432">Numbers from BotProperties: launcherKF 0.000242, launcherKP 0.003, launcherKI 0, launcherTicksPerRev 28,</text>
  <text class="group mono" x="24" y="447">launcherUpdateMs 50, launcherStartRpm 1000, launcherRpmStep 50, launcherAtSpeedRpm 50</text>
</svg>
