<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
  <title id="title">One loop of the launcher: a speed that corrects itself</title>
  <desc id="desc">Each loop the Launcher reads gamepad 1: the bumpers change the target speed and the right trigger says whether to spin. Every 50 milliseconds it measures the wheel's speed, asks VelocityController for the power that reaches the target, and sends that power to the motor only while the trigger is held. The motor's new speed is measured again next time: a feedback loop.</desc>
  <style>
    /* Light theme. Dark theme is at the bottom of this block. */
    .panel { fill: #ffffff; stroke: #d3dae2; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1b2838; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-weight: 700; }
    .sub { fill: #566475; }
    .label { font-size: 11.5px; fill: #33475c; }
    .group { font-size: 10.5px; fill: #566475; letter-spacing: 0.04em; }
    .heading { font-size: 13px; font-weight: 700; }
    .accent-text { fill: #8a5a00; font-weight: 600; }
    .node text, .chip text { text-anchor: middle; }
    .ours { fill: #e6f0fa; stroke: #2c6aa3; stroke-width: 1.5; }
    .plain { fill: #f4f6f8; stroke: #8794a3; stroke-width: 1.25; }
    .sdk { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; }
    .lib { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .world { fill: #ffffff; stroke: #1b2838; stroke-width: 1.5; }
    .key { fill: #ffe7ad; stroke: #b37400; stroke-width: 2; }
    .frame { fill: none; stroke: #a3afbc; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .rule { stroke: #a3afbc; stroke-width: 1; }
    .edge { fill: none; stroke: #33475c; stroke-width: 1.5; stroke-linejoin: round; }
    .dashed { stroke-dasharray: 5 4; }
    .accent { stroke: #b37400; stroke-width: 2; }
    .head { fill: #33475c; }
    .head-accent { fill: #b37400; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #151b23; stroke: #2a3441; }
      text { fill: #e4e9ef; }
      .sub { fill: #9ba8b7; }
      .label { fill: #c3ccd6; }
      .group { fill: #9ba8b7; }
      .accent-text { fill: #f2b23a; }
      .ours { fill: #1b2f45; stroke: #74aee4; }
      .plain { fill: #1c232c; stroke: #6b7786; }
      .sdk { fill: #232a33; stroke: #8f9baa; }
      .lib { fill: #232a33; stroke: #8f9baa; }
      .world { fill: #151b23; stroke: #e4e9ef; }
      .key { fill: #4a3608; stroke: #f2b23a; }
      .frame { stroke: #4b5868; }
      .rule { stroke: #4b5868; }
      .edge { stroke: #c3ccd6; }
      .accent { stroke: #f2b23a; }
      .head { fill: #c3ccd6; }
      .head-accent { fill: #f2b23a; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="759" height="419" rx="10"/>
  <text class="heading mono" x="24" y="40">Launcher, one loop</text>
  <text class="label" x="24" y="58">Read first. Then act.</text>

  <!-- Input -->
  <g class="node">
    <rect class="world" x="24" y="186" width="132" height="66" rx="18"/>
    <text class="title" font-size="13" x="90" y="208.6">Gamepad 1</text>
    <text class="sub" font-size="11.5" x="90" y="224.0">right trigger,</text>
    <text class="sub" font-size="11.5" x="90" y="239.0">bumpers</text>
  </g>

  <!-- Read -->
  <rect class="frame" x="184" y="130" width="228" height="176" rx="10"/>
  <text class="group mono" x="196" y="148">read: HandleUserInput()</text>
  <g class="node">
    <rect class="plain" x="198" y="158" width="200" height="52" rx="8"/>
    <text class="title" font-size="13" x="298" y="181.1">bumpers</text>
    <text class="sub" font-size="11.5" x="298" y="196.5">target up or down 50 RPM</text>
  </g>
  <g class="node">
    <rect class="plain" x="198" y="228" width="200" height="52" rx="8"/>
    <text class="title" font-size="13" x="298" y="251.1">right trigger</text>
    <text class="sub" font-size="11.5" x="298" y="266.5">held, or let go</text>
  </g>
  <path class="edge" d="M156 219 L184 219" marker-end="url(#arrow)"/>

  <!-- Act -->
  <rect class="frame" x="440" y="56" width="260" height="250" rx="10"/>
  <text class="group mono" x="452" y="74">act: Process(), every 50 ms</text>
  <g class="node">
    <rect class="plain" x="456" y="84" width="228" height="52" rx="8"/>
    <text class="title" font-size="13" x="570" y="107.0">measure the wheel's speed</text>
    <text class="sub mono" font-size="11" x="570" y="122.3">DcMotorEx.getVelocity()</text>
  </g>
  <g class="node">
    <rect class="ours" x="456" y="158" width="228" height="52" rx="8"/>
    <text class="title mono" font-size="13" x="570" y="181.1">VelocityController</text>
    <text class="sub" font-size="11.5" x="570" y="196.5">the power that reaches the target</text>
  </g>
  <g class="node">
    <rect class="plain" x="456" y="228" width="228" height="52" rx="8"/>
    <text class="title" font-size="13" x="570" y="251.1">is the trigger held?</text>
    <text class="sub" font-size="11.5" x="570" y="266.5">yes: that power. no: power 0.</text>
  </g>
  <path class="edge" d="M570 136 L570 158" marker-end="url(#arrow)"/>
  <path class="edge" d="M570 210 L570 228" marker-end="url(#arrow)"/>
  <path class="edge" d="M398 184 L456 184" marker-end="url(#arrow)"/>
  <path class="edge" d="M398 254 L456 254" marker-end="url(#arrow)"/>

  <!-- Output, and the feedback that makes it a control loop -->
  <g class="node">
    <rect class="world" x="456" y="340" width="228" height="44" rx="18"/>
    <text class="title" font-size="13" x="570" y="366.6">the launcher motor</text>
  </g>
  <path class="edge" d="M570 280 L570 340" marker-end="url(#arrow)"/>
  <text class="label mono" x="560" y="331" text-anchor="end">DcMotorEx.setPower()</text>
  <path class="edge accent" d="M684 362 L724 362 L724 110 L684 110" marker-end="url(#arrow-accent)"/>
  <text class="label accent-text" x="736" y="404" text-anchor="end">its new speed is measured next time</text>
</svg>
