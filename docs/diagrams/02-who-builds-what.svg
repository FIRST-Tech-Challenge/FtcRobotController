<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" role="img" aria-labelledby="title desc">
  <title id="title">Who builds what when HyDrive starts</title>
  <desc id="desc">HyDrive makes a BotProperties and then builds the Bot with it. The Bot builds five things in order: HydraOpMode and SafeModeKey always; ImuSelector and Drive_Manual unless driveDisabled is true; Launcher unless launcherDisabled is true.</desc>
  <style>
    /* Light theme. Dark theme is at the bottom of this block. */
    .panel { fill: #ffffff; stroke: #d3dae2; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1b2838; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-weight: 700; }
    .sub { fill: #566475; }
    .label { font-size: 11.5px; fill: #33475c; }
    .group { font-size: 10.5px; fill: #566475; letter-spacing: 0.04em; }
    .heading { font-size: 13px; font-weight: 700; }
    .accent-text { fill: #8a5a00; font-weight: 600; }
    .node text, .chip text { text-anchor: middle; }
    .ours { fill: #e6f0fa; stroke: #2c6aa3; stroke-width: 1.5; }
    .plain { fill: #f4f6f8; stroke: #8794a3; stroke-width: 1.25; }
    .sdk { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; }
    .lib { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .world { fill: #ffffff; stroke: #1b2838; stroke-width: 1.5; }
    .key { fill: #ffe7ad; stroke: #b37400; stroke-width: 2; }
    .frame { fill: none; stroke: #a3afbc; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .rule { stroke: #a3afbc; stroke-width: 1; }
    .edge { fill: none; stroke: #33475c; stroke-width: 1.5; stroke-linejoin: round; }
    .dashed { stroke-dasharray: 5 4; }
    .accent { stroke: #b37400; stroke-width: 2; }
    .head { fill: #33475c; }
    .head-accent { fill: #b37400; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #151b23; stroke: #2a3441; }
      text { fill: #e4e9ef; }
      .sub { fill: #9ba8b7; }
      .label { fill: #c3ccd6; }
      .group { fill: #9ba8b7; }
      .accent-text { fill: #f2b23a; }
      .ours { fill: #1b2f45; stroke: #74aee4; }
      .plain { fill: #1c232c; stroke: #6b7786; }
      .sdk { fill: #232a33; stroke: #8f9baa; }
      .lib { fill: #232a33; stroke: #8f9baa; }
      .world { fill: #151b23; stroke: #e4e9ef; }
      .key { fill: #4a3608; stroke: #f2b23a; }
      .frame { stroke: #4b5868; }
      .rule { stroke: #4b5868; }
      .edge { stroke: #c3ccd6; }
      .accent { stroke: #f2b23a; }
      .head { fill: #c3ccd6; }
      .head-accent { fill: #f2b23a; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="759" height="523" rx="10"/>

  <!-- HyDrive makes two objects -->
  <g class="node">
    <rect class="ours" x="24" y="20" width="232" height="44" rx="8"/>
    <text class="title mono" font-size="13" x="140" y="46.5">HyDrive.runOpMode()</text>
  </g>
  <g class="node">
    <rect class="ours" x="504" y="20" width="232" height="44" rx="8"/>
    <text class="title mono" font-size="13" x="620" y="46.5">BotProperties</text>
  </g>
  <path class="edge" d="M256 42 L504 42" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="34" text-anchor="middle">1. makes the settings</text>
  <g class="node">
    <rect class="ours" x="24" y="124" width="712" height="48" rx="8"/>
    <text class="title mono" font-size="13" x="380" y="145.1">Bot</text>
    <text class="sub" font-size="11.5" x="380" y="160.5">builds every part that is switched on</text>
  </g>
  <path class="edge" d="M140 64 L140 124" marker-end="url(#arrow)"/>
  <text class="label" x="150" y="98">2. builds the Bot</text>
  <path class="edge" d="M620 64 L620 124" marker-end="url(#arrow)"/>
  <text class="label" x="610" y="98" text-anchor="end">hands it the settings</text>

  <!-- The Bot builds these, left to right -->
  <g class="node">
    <rect class="ours" x="24" y="232" width="120" height="72" rx="8"/>
    <text class="title mono" font-size="13" x="84" y="250.1">HydraOpMode</text>
    <text class="sub" font-size="11.5" x="84" y="265.5">telemetry,</text>
    <text class="sub" font-size="11.5" x="84" y="280.5">hardware map,</text>
    <text class="sub" font-size="11.5" x="84" y="295.5">gamepads</text>
  </g>
  <path class="edge" d="M84 172 L84 232" marker-end="url(#arrow)"/>
  <text class="label mono" x="93" y="206">a</text>
  <g class="node">
    <rect class="ours" x="156" y="232" width="120" height="72" rx="8"/>
    <text class="title mono" font-size="13" x="216" y="257.6">SafeModeKey</text>
    <text class="sub" font-size="11.5" x="216" y="273.0">reads the key,</text>
    <text class="sub" font-size="11.5" x="216" y="288.0">one time</text>
  </g>
  <path class="edge" d="M216 172 L216 232" marker-end="url(#arrow)"/>
  <text class="label mono" x="225" y="206">b</text>
  <g class="node">
    <rect class="ours" x="288" y="232" width="132" height="72" rx="8"/>
    <text class="title mono" font-size="13" x="354" y="257.6">ImuSelector</text>
    <text class="sub" font-size="11.5" x="354" y="273.0">picks where the</text>
    <text class="sub" font-size="11.5" x="354" y="288.0">heading comes from</text>
  </g>
  <path class="edge" d="M354 172 L354 232" marker-end="url(#arrow)"/>
  <text class="label mono" x="363" y="206">c</text>
  <g class="node">
    <rect class="ours" x="432" y="232" width="132" height="72" rx="8"/>
    <text class="title mono" font-size="13" x="498" y="257.6">Drive_Manual</text>
    <text class="sub" font-size="11.5" x="498" y="273.0">driver control</text>
    <text class="sub" font-size="11.5" x="498" y="288.0">of the wheels</text>
  </g>
  <path class="edge" d="M498 172 L498 232" marker-end="url(#arrow)"/>
  <text class="label mono" x="507" y="206">d</text>
  <g class="node">
    <rect class="ours" x="576" y="232" width="160" height="72" rx="8"/>
    <text class="title mono" font-size="13" x="656" y="257.6">Launcher</text>
    <text class="sub" font-size="11.5" x="656" y="273.0">holds the wheel</text>
    <text class="sub" font-size="11.5" x="656" y="288.0">at a speed</text>
  </g>
  <path class="edge" d="M656 172 L656 232" marker-end="url(#arrow)"/>
  <text class="label mono" x="665" y="206">e</text>

  <!-- What each part makes for itself -->
  <g class="node">
    <rect class="ours" x="288" y="356" width="132" height="52" rx="8"/>
    <text class="title mono" font-size="13" x="354" y="379.1">an Imu</text>
    <text class="sub" font-size="11.5" x="354" y="394.5">Pinpoint or hub</text>
  </g>
  <path class="edge" d="M354 304 L354 356" marker-end="url(#arrow)"/>
  <path class="edge" d="M498 304 L498 356" marker-end="url(#arrow)"/>
  <g class="chip">
    <rect class="sdk" x="432" y="356" width="132" height="26" rx="2"/>
    <text class="mono" font-size="11.5" x="498" y="373.0">4 x DcMotorEx</text>
  </g>
  <g class="chip">
    <rect class="ours" x="432" y="390" width="132" height="26" rx="6"/>
    <text class="mono" font-size="11.5" x="498" y="407.0">1 x Debouncer</text>
  </g>
  <path class="edge" d="M656 304 L656 356" marker-end="url(#arrow)"/>
  <g class="chip">
    <rect class="sdk" x="576" y="356" width="160" height="26" rx="2"/>
    <text class="mono" font-size="11.5" x="656" y="373.0">1 x DcMotorEx</text>
  </g>
  <g class="chip">
    <rect class="ours" x="576" y="390" width="160" height="26" rx="6"/>
    <text class="mono" font-size="11.5" x="656" y="407.0">VelocityController</text>
  </g>
  <g class="chip">
    <rect class="ours" x="576" y="424" width="160" height="26" rx="6"/>
    <text class="mono" font-size="11.5" x="656" y="441.0">2 x Debouncer</text>
  </g>

  <!-- Which settings leave a column out -->
  <path class="edge" d="M24 466 L24 474 L276 474 L276 466"/>
  <text class="label" x="150" y="492" text-anchor="middle">always built</text>
  <path class="edge accent" d="M288 466 L288 474 L564 474 L564 466"/>
  <text class="label accent-text" x="426" y="492" text-anchor="middle">left out when driveDisabled = true</text>
  <path class="edge accent" d="M576 466 L576 474 L736 474 L736 466"/>
  <text class="label accent-text" x="656" y="492" text-anchor="middle">left out when</text>
  <text class="label accent-text" x="656" y="507" text-anchor="middle">launcherDisabled = true</text>
</svg>
