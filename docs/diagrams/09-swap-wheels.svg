<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Swap point: the driver or a path drives the wheels</title>
  <desc id="desc">In TeleOp, gamepad 1 feeds Drive_Manual, and Drive.LimitPower applies Safe Mode. In an auto, the auto OpMode's own paths feed Pedro's Follower, which learns the robot's position from TwoWheelLocalizer, and SafeModeMecanum applies Safe Mode. Both end at the same four drive motors.</desc>
  <style>
    /* Light theme. Dark theme is at the bottom of this block. */
    .panel { fill: #ffffff; stroke: #d3dae2; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1b2838; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-weight: 700; }
    .sub { fill: #566475; }
    .label { font-size: 11.5px; fill: #33475c; }
    .group { font-size: 10.5px; fill: #566475; letter-spacing: 0.04em; }
    .heading { font-size: 13px; font-weight: 700; }
    .accent-text { fill: #8a5a00; font-weight: 600; }
    .node text, .chip text { text-anchor: middle; }
    .ours { fill: #e6f0fa; stroke: #2c6aa3; stroke-width: 1.5; }
    .plain { fill: #f4f6f8; stroke: #8794a3; stroke-width: 1.25; }
    .sdk { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; }
    .lib { fill: #eceef1; stroke: #6f7c8a; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .world { fill: #ffffff; stroke: #1b2838; stroke-width: 1.5; }
    .key { fill: #ffe7ad; stroke: #b37400; stroke-width: 2; }
    .frame { fill: none; stroke: #a3afbc; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .rule { stroke: #a3afbc; stroke-width: 1; }
    .edge { fill: none; stroke: #33475c; stroke-width: 1.5; stroke-linejoin: round; }
    .dashed { stroke-dasharray: 5 4; }
    .accent { stroke: #b37400; stroke-width: 2; }
    .head { fill: #33475c; }
    .head-accent { fill: #b37400; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #151b23; stroke: #2a3441; }
      text { fill: #e4e9ef; }
      .sub { fill: #9ba8b7; }
      .label { fill: #c3ccd6; }
      .group { fill: #9ba8b7; }
      .accent-text { fill: #f2b23a; }
      .ours { fill: #1b2f45; stroke: #74aee4; }
      .plain { fill: #1c232c; stroke: #6b7786; }
      .sdk { fill: #232a33; stroke: #8f9baa; }
      .lib { fill: #232a33; stroke: #8f9baa; }
      .world { fill: #151b23; stroke: #e4e9ef; }
      .key { fill: #4a3608; stroke: #f2b23a; }
      .frame { stroke: #4b5868; }
      .rule { stroke: #4b5868; }
      .edge { stroke: #c3ccd6; }
      .accent { stroke: #f2b23a; }
      .head { fill: #c3ccd6; }
      .head-accent { fill: #f2b23a; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="759" height="329" rx="10"/>

  <!-- TeleOp lane -->
  <rect class="frame" x="24" y="20" width="540" height="100" rx="10"/>
  <text class="group mono" x="36" y="38">TeleOp: HyDrive, the normal setting</text>
  <g class="node">
    <rect class="world" x="40" y="52" width="156" height="52" rx="18"/>
    <text class="title" font-size="13" x="118" y="75.0">Gamepad 1</text>
    <text class="sub" font-size="11.5" x="118" y="90.5">the driver</text>
  </g>
  <g class="node">
    <rect class="ours" x="216" y="52" width="156" height="52" rx="8"/>
    <text class="title mono" font-size="13" x="294" y="75.0">Drive_Manual</text>
    <text class="sub" font-size="11.5" x="294" y="90.5">driver control</text>
  </g>
  <g class="node">
    <rect class="key" x="392" y="52" width="156" height="52" rx="8"/>
    <text class="title mono" font-size="12.5" x="470" y="74.9">Drive.LimitPower()</text>
    <text class="sub" font-size="11.5" x="470" y="90.5">Safe Mode limit</text>
  </g>
  <path class="edge" d="M196 78 L216 78" marker-end="url(#arrow)"/>
  <path class="edge" d="M372 78 L392 78" marker-end="url(#arrow)"/>

  <!-- Auto lane -->
  <rect class="frame" x="24" y="144" width="540" height="170" rx="10"/>
  <text class="group mono" x="36" y="162">Auto: PedroAuto, with driveDisabled = true</text>
  <g class="node">
    <rect class="ours" x="40" y="176" width="156" height="52" rx="8"/>
    <text class="title mono" font-size="13" x="118" y="199.1">AutoShapeZ</text>
    <text class="sub" font-size="11.5" x="118" y="214.5">its own paths</text>
  </g>
  <g class="node">
    <rect class="lib" x="216" y="176" width="156" height="52" rx="2"/>
    <text class="title mono" font-size="13" x="294" y="199.1">Follower</text>
    <text class="sub" font-size="11.5" x="294" y="214.5">from Pedro Pathing</text>
  </g>
  <g class="node">
    <rect class="key" x="392" y="176" width="156" height="52" rx="8"/>
    <text class="title mono" font-size="13" x="470" y="199.1">SafeModeMecanum</text>
    <text class="sub" font-size="11.5" x="470" y="214.5">Safe Mode limit</text>
  </g>
  <g class="node">
    <rect class="lib" x="216" y="254" width="156" height="48" rx="2"/>
    <text class="title mono" font-size="12.5" x="294" y="274.9">TwoWheelLocalizer</text>
    <text class="sub" font-size="11.5" x="294" y="290.5">2 pods and the hub IMU</text>
  </g>
  <path class="edge" d="M196 202 L216 202" marker-end="url(#arrow)"/>
  <path class="edge" d="M372 202 L392 202" marker-end="url(#arrow)"/>
  <path class="edge" d="M294 254 L294 228" marker-end="url(#arrow)"/>
  <text class="label" x="382" y="268">tells it where</text>
  <text class="label" x="382" y="283">the robot is</text>

  <!-- Both lanes end at the same motors -->
  <g class="node">
    <rect class="world" x="604" y="106" width="132" height="68" rx="18"/>
    <text class="title" font-size="13" x="670" y="129.6">4 drive motors</text>
    <text class="sub" font-size="11.5" x="670" y="145.0">the same ones,</text>
    <text class="sub" font-size="11.5" x="670" y="160.0">either way</text>
  </g>
  <path class="edge" d="M548 78 L670 78 L670 106" marker-end="url(#arrow)"/>
  <path class="edge" d="M548 202 L670 202 L670 174" marker-end="url(#arrow)"/>
</svg>
