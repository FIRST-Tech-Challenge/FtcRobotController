name: Build

on:
  # Every pull request, whatever branch it targets, so stacked PRs get checked too.
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # gradle.properties (owned by the FTC SDK) sets -Xmx1024M; runners have plenty more.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Validates gradle-wrapper.jar checksum and caches ~/.gradle between runs
      - uses: gradle/actions/setup-gradle@v4

      # TeamCode depends on :FtcRobotController, so both modules compile.
      # Only one APK is packaged, which keeps the run a few minutes shorter.
      - name: Build TeamCode
        run: ./gradlew :TeamCode:assembleDebug --no-daemon --stacktrace

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore

  # Runs alongside the build job, not before it: a failing test never hides whether
  # the APK builds, and neither job waits on the other. Tests live in
  # TeamCode/src/test/ and are wired up by TeamCode/quality.gradle.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :TeamCode:testDebugUnitTest --no-daemon --stacktrace

      # Always upload, not just on failure: the report shows passed, failed, and
      # disabled counts, which is worth seeing on a green run too.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            TeamCode/build/reports/tests/**
            TeamCode/build/test-results/**
          if-no-files-found: ignore
