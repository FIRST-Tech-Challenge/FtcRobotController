name: FTC Production Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'yulu'
          java-version: '17'

      - name: Build Production APK
        run: ./gradlew assembleDebug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TeamCode/build/outputs/apk/debug/TeamCode-debug.apk
