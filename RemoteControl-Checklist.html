<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Control - Code Checklist</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #1b1f24; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .progress { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .bar { height: 14px; background: #e9eef3; border-radius: 7px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: #1a7f37; transition: width .25s; }
  .item { background: #fff; border: 2px solid #d0d7de; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .item.done { border-color: #1a7f37; background: #e8f8ee; }
  .item label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .item input[type=checkbox] { width: 26px; height: 26px; margin-top: 2px; flex: none; accent-color: #1a7f37; cursor: pointer; }
  .item h2 { margin: 0; font-size: 1.15rem; }
  .item .num { display: inline-block; min-width: 1.6em; margin-right: 8px; padding: 0 6px; text-align: center; border-radius: 12px; background: #1f6feb; color: #fff; font-size: .95rem; }
  .item.done .num { background: #1a7f37; }
  .item.done .t { text-decoration: line-through; color: #4b6355; }
  .section { margin: 24px 0 10px; }
  .section h3 { margin: 0; font-size: 1.25rem; padding-bottom: 4px; border-bottom: 2px solid #d0d7de; }
  .section p { margin: 6px 0 0; color: #555; }
  .item p { margin: 6px 0 0; color: #333; }
  .item ol { margin: 8px 0 0; padding-left: 22px; }
  .item li { margin: 4px 0; }
  .file { font-family: Consolas, monospace; background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
  details { margin: 8px 0 0 38px; }
  summary { cursor: pointer; color: #1f6feb; }
  .body { margin-left: 38px; }
  pre.code { margin: 8px 0 0; padding: 10px 14px; background: #1f2430; color: #e6edf3; border-radius: 6px; font-family: Consolas, monospace; font-size: .9rem; overflow-x: auto; }
  .all-done { display: none; background: #1a7f37; color: #fff; border-radius: 10px; padding: 14px 16px; font-weight: 700; text-align: center; margin-bottom: 12px; }
  button { font: inherit; padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; }
  footer { margin-top: 8px; color: #57606a; font-size: .85rem; text-align: right; }
</style>
</head>
<body>
<main>
  <h1>Code fixes for our robot</h1>

  <div class="progress">
    <strong id="count">0 of 0 done</strong>
    <div class="bar"><div id="fill"></div></div>
  </div>

  <div class="all-done" id="alldone">All done! Great work.</div>

  <div id="list"></div>

  <p><button id="reset">Uncheck everything</button></p>
  <footer>v20261005-02</footer>
</main>

<script>
  // Add new checklist items here, in the order they should be done. Items are numbered automatically.
  // "steps" and "hint" are optional. "section" and "sectionIntro" start a new heading above an item.
  const items = [
    {
      section: "RemoteControl.java",
      id: "remove-park-button-controls",
      title: "Remove the unused D-pad park button controls",
      why: "Delete the park variable and the D-pad Down/D-pad Up block because the park value is never used and the buttons do not change the robot's behavior.",
      code: [
        "boolean park = false;",
        "",
        "if(gamepad1.dpad_down) {",
        "    park = true;",
        "} else if(gamepad1.dpad_up) {",
        "    park = false;",
        "}"
      ].join("\n"),
    },
    {
      id: "reassign-shooter-stop-button",
      title: "Move the shooter stop control to a safer button",
      why: "Pressing the right stick can happen accidentally while turning the robot, which could unexpectedly stop the shooter. Choose a different button that is less likely to be pressed by mistake.",
      code: [
        "if (gamepad1.right_stick_button) {",
        "    shooterSpeed = 0.0;",
        "    speedChanged = true;",
        "}"
      ].join("\n"),
    }
  ];

  const KEY = "remoteControlChecklist.v2";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { saved = {}; }

  const list = document.getElementById("list");

  items.forEach(function (it, index) {
    if (it.section) {
      const sec = document.createElement("div");
      sec.className = "section";
      const sh = document.createElement("h3");
      sh.textContent = it.section;
      sec.appendChild(sh);
      if (it.sectionIntro) {
        const sp = document.createElement("p");
        sp.textContent = it.sectionIntro;
        sec.appendChild(sp);
      }
      list.appendChild(sec);
    }
    const box = document.createElement("div");
    box.className = "item";

    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!saved[it.id];
    const h = document.createElement("h2");
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = index + 1;
    const t = document.createElement("span");
    t.className = "t";
    t.innerHTML = it.title;
    h.appendChild(num);
    h.appendChild(t);
    label.appendChild(cb);
    label.appendChild(h);
    box.appendChild(label);

    const body = document.createElement("div");
    body.className = "body";
    if (it.why) {
      const p = document.createElement("p");
      p.textContent = it.why;
      body.appendChild(p);
    }
    if (it.code) {
      const pre = document.createElement("pre");
      pre.className = "code";
      pre.textContent = it.code;
      body.appendChild(pre);
    }
    if (it.steps) {
      const ol = document.createElement("ol");
      it.steps.forEach(function (s) {
        const li = document.createElement("li");
        li.innerHTML = s;
        ol.appendChild(li);
      });
      body.appendChild(ol);
    }
    box.appendChild(body);

    if (it.hint) {
      const d = document.createElement("details");
      const s = document.createElement("summary");
      s.textContent = "Hint";
      const hp = document.createElement("p");
      hp.innerHTML = it.hint;
      d.appendChild(s);
      d.appendChild(hp);
      box.appendChild(d);
    }

    cb.addEventListener("change", function () {
      saved[it.id] = cb.checked;
      localStorage.setItem(KEY, JSON.stringify(saved));
      refresh();
    });
    it.box = box;
    it.cb = cb;
    list.appendChild(box);
  });

  function refresh() {
    let done = 0;
    items.forEach(function (it) {
      it.box.classList.toggle("done", it.cb.checked);
      if (it.cb.checked) done++;
    });
    document.getElementById("count").textContent = done + " of " + items.length + " done";
    document.getElementById("fill").style.width = (items.length ? 100 * done / items.length : 0) + "%";
    document.getElementById("alldone").style.display = items.length && done === items.length ? "block" : "none";
  }

  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Uncheck everything?")) return;
    saved = {};
    localStorage.removeItem(KEY);
    items.forEach(function (it) { it.cb.checked = false; });
    refresh();
  });

  refresh();
</script>
</body>
</html>
